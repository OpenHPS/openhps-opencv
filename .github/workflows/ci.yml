name: CI

on:
    push:
        branches: [master, dev]
    pull_request:
        branches: [master, dev]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
    ci:
        uses: OpenHPS/workflows/.github/workflows/module.yml@v1
        secrets: inherit
        with:
            # @openhps/opencv compiles OpenCV 4.6.0 from source in postinstall. Its
            # vendored ade 0.1.1f misses an #include <cstdint>, which GCC 13 no longer
            # supplies transitively, so the build dies on "'uintptr_t' in namespace
            # 'std' does not name a type" once ubuntu-latest moved to 24.04. Pin to the
            # last image with a toolchain this OpenCV release compiles under.
            runner: 'ubuntu-22.04'
            # The suites need a loadable @u4/opencv4nodejs addon. opencv-build-npm builds
            # the OpenCV library itself here, but not a binding mocha can require, so
            # every spec failed to load -- surfacing as a misleading "Cannot use import
            # statement outside a module" once mocha fell back to import(). Native
            # testing belongs to the docker images this repo already builds
            # (docker.yml, opencvjs.yml, `npm run test:docker`).
            run-tests: false
